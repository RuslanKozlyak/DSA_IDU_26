name: Проверка лабораторной

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить файлы PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: >-
          python -m pip install
          "matplotlib>=3.8"
          "numpy>=1.26"
          "pandas>=2.2"
          "tqdm>=4.66"

      - name: Проверить состав PR и короткие тесты
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "${PR_BASE_SHA}:ci/check_submission.py" > "$RUNNER_TEMP/check_submission.py"
          python "$RUNNER_TEMP/check_submission.py" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
